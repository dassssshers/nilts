name: Publish 🛳️

on:
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - main
    paths:
      - packages/**/CHANGELOG.md
      - packages/**/pubspec.yaml
      - .release-please-manifest.json

  push:
    tags:
      - 'nilts-v[0-9]+.[0-9]+.[0-9]+*'
      - 'nilts_clock-v[0-9]+.[0-9]+.[0-9]+*'
      - 'nilts_core-v[0-9]+.[0-9]+.[0-9]+*'
      - 'nilts_flutter_hooks-v[0-9]+.[0-9]+.[0-9]+*'

permissions: {}

jobs:
  publish_dry_run_nilts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.head_ref == 'release-please--branches--main--components--nilts'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter
      - name: Publish - dry run
        run: dart pub publish --dry-run
        working-directory: packages/nilts

  publish_dry_run_nilts_clock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.head_ref == 'release-please--branches--main--components--nilts_clock'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter
      - name: Publish - dry run
        run: dart pub publish --dry-run
        working-directory: packages/nilts_clock

  publish_dry_run_nilts_core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.head_ref == 'release-please--branches--main--components--nilts_core'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter
      - name: Publish - dry run
        run: dart pub publish --dry-run
        working-directory: packages/nilts_core

  publish_dry_run_nilts_flutter_hooks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.head_ref == 'release-please--branches--main--components--nilts_flutter_hooks'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter
      - name: Publish - dry run
        run: dart pub publish --dry-run
        working-directory: packages/nilts_flutter_hooks

  publish_nilts:
    if: startsWith(github.ref, 'refs/tags/nilts-v')
    permissions:
      contents: read
      id-token: write # Required for authentication using OIDC
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
    with:
      environment: 'pub.dev'
      working-directory: packages/nilts

  publish_nilts_clock:
    if: startsWith(github.ref, 'refs/tags/nilts_clock-v')
    permissions:
      contents: read
      id-token: write # Required for authentication using OIDC
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
    with:
      environment: 'pub.dev'
      working-directory: packages/nilts_clock

  publish_nilts_core:
    if: startsWith(github.ref, 'refs/tags/nilts_core-v')
    permissions:
      contents: read
      id-token: write # Required for authentication using OIDC
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
    with:
      environment: 'pub.dev'
      working-directory: packages/nilts_core

  publish_nilts_flutter_hooks:
    if: startsWith(github.ref, 'refs/tags/nilts_flutter_hooks-v')
    permissions:
      contents: read
      id-token: write # Required for authentication using OIDC
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
    with:
      environment: 'pub.dev'
      working-directory: packages/nilts_flutter_hooks
